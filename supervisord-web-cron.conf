
; Appended to upstream's worker supervisord.conf (the three messenger consumers):
; the web and cron roles run beside them, each through upstream's own entrypoint.
; stopasgroup: the entrypoint scripts don't exec, so TERM must reach Apache and cron too.
[program:web]
command=/entrypoint.sh
environment=DOCKER_MAUTIC_ROLE="mautic_web"
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:cron]
command=/entrypoint.sh
environment=DOCKER_MAUTIC_ROLE="mautic_cron"
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
